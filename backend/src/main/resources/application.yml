server:
  port: 8080
  # Ouvir em todas as interfaces (0.0.0.0) para aceitar conexões do iPhone/emulador.
  # Só 127.0.0.1 = só mesmo Mac; 0.0.0.0 = também 192.168.x.x.
  address: "0.0.0.0"

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/subsdb
    username: subs
    password: subs
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  jwt:
    secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_64+"
    issuer: "subs-app"
    accessTokenMinutes: 60
  scheduler:
    horizonDays: 30
    batchSize: 500
  firebase:
    enabled: true
    serviceAccountPath: "classpath:firebase-service-account.json" # coloque o arquivo depois
