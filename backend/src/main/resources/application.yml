server:
  port: 8080
  # Ouvir em todas as interfaces (0.0.0.0) para aceitar conexões do iPhone/emulador.
  # Só 127.0.0.1 = só mesmo Mac; 0.0.0.0 = também 192.168.x.x.
  address: "0.0.0.0"

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/subsdb}
    username: ${SPRING_DATASOURCE_USERNAME:subs}
    password: ${SPRING_DATASOURCE_PASSWORD:subs}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_64+}
    issuer: ${APP_JWT_ISSUER:subs-app}
    accessTokenMinutes: ${APP_JWT_ACCESS_TOKEN_MINUTES:60}
  scheduler:
    horizonDays: ${APP_SCHEDULER_HORIZON_DAYS:30}
    batchSize: ${APP_SCHEDULER_BATCH_SIZE:500}
  firebase:
    enabled: ${APP_FIREBASE_ENABLED:false}
    serviceAccountPath: ${APP_FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}
